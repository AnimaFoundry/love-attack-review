<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491.275591 179" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Proposed framing evaluation and negative controls</title>
<desc id="figure-description">A proposed factorial framing design produces observable outputs, which are checked against an external task contract. Negative controls and held-out evaluation constrain interpretation. This diagram contains no results.</desc>
<rect width="100%" height="100%" fill="white"/>
<rect x="0.000000" y="19" width="150" height="71" rx="4" fill="#EDF3F6" stroke="#235C78"/>
<text x="75.000000" y="37" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="bold">FRAMING CONDITIONS</text>
<text x="75.000000" y="54" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="normal">Compassion x legitimacy</text>
<text x="75.000000" y="71" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="normal">Fixed task and authority</text>
<rect x="170.637795" y="19" width="150" height="71" rx="4" fill="#EDF3F6" stroke="#235C78"/>
<text x="245.637795" y="37" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="bold">OBSERVABLE OUTPUTS</text>
<text x="245.637795" y="54" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="normal">Answers and mock actions</text>
<text x="245.637795" y="71" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="normal">Usage and termination</text>
<rect x="341.275591" y="19" width="150" height="71" rx="4" fill="#EDF3F6" stroke="#235C78"/>
<text x="416.275591" y="37" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="bold">EXTERNAL CHECKS</text>
<text x="416.275591" y="54" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="normal">Contract and final state</text>
<text x="416.275591" y="71" text-anchor="middle" font-family="sans-serif" font-size="7.8" font-weight="normal">Utility, violations, cost</text>
<path d="M152.000000 55 H168.637795 m-4 -3 l4 3 -4 3" fill="none" stroke="#235C78"/>
<path d="M322.637795 55 H339.275591 m-4 -3 l4 3 -4 3" fill="none" stroke="#235C78"/>
<text x="245.637795" y="114" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold">NEGATIVE CONTROLS</text>
<text x="245.637795" y="132" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="normal">Matched neutral text | Permitted warmth | Valid repetition | Authorized correction</text>
<text x="245.637795" y="155" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="normal">Hold out task/template families; report missingness and all prespecified outcomes.</text>
</svg>
